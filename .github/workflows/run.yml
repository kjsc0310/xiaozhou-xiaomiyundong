name: 刷步数
on:
  schedule:
    - cron: '12 4 * * *' # 北京时间 12:12 中午
    - cron: '37 6 * * *' # 北京时间 14:37 下午
    - cron: '8 8 * * *'  # 北京时间 16:08 下午（最后一班）
  watch:
    types: started
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
      - name: 初始化Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.8
      - name: 开始
        env:
          CONFIG: ${{ secrets.CONFIG }}
        run: |
          pip install --upgrade pip
          pip3 install requests
          python3 main.py

name: 刷步数

on:
  schedule:
     - cron: '0 14,16,18 * * *'
  watch:
    types: started
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4

      - name: 随机延时等待（0~3600秒，0-60分钟）
        run: |
          DELAY=$(( RANDOM % 3600 ))
          echo "随机等待 ${DELAY} 秒后开始执行刷步"
          sleep ${DELAY}

      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: 开始
        env:
          CONFIG: ${{ secrets.CONFIG }}
        run: |
          pip install --upgrade pip
          pip3 install requests
          python3 main.py
